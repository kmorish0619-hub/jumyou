font:48px/1.4 Georgia,serif;font-variant-numeric:tabular-nums;letter-spacing:.02em}.number span{font:13px sans-serif;margin:0 7px 0 3px}.track{height:7px;border-radius:10px;background:#d1d9cb;margin:20px 0 8px;overflow:hidden}.track>i{display:block;background:var(--accent);height:100%;border-radius:10px}.life .muted{font-size:12px}.section-title{margin:22px 0 17px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 24px}.tabs button{padding:8px 17px;border-radius:30px;border:1px solid var(--line);font-size:13px}.tabs .active{background:var(--ink);border-color:var(--ink);color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:23px;overflow-wrap:anywhere}.card .category{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:9px}.card p{margin:9px 0 17px;font-size:13px;color:#66776d;white-space:pre-wrap}.card footer{margin-top:19px;padding-top:13px;border-top:1px solid #eef0eb;display:flex;gap:8px;align-items:center;justify-content:space-between}.card footer button{font-size:12px}.tag{font-size:11px;border-radius:20px;background:var(--light);padding:4px 10px;display:inline-block}.done{background:#faf0df;color:#8f672d}.empty{text-align:center;padding:42px 20px;background:#ffffff88;border:1px dashed #ccd6c6;border-radius:20px}.empty p{font-size:13px;color:var(--muted);margin:10px 0 18px}.timeline{border-left:1px solid #cdd7c7;margin-left:8px;padding-left:26px}.period{position:relative;margin:30px 0 14px;font-size:13px;font-weight:600}.period:before{content:'';position:absolute;left:-32px;top:9px;width:9px;height:9px;border-radius:50%;background:#7b9878;box-shadow:0 0 0 5px var(--bg)}.period span{font-weight:400;font-size:11px;color:var(--muted);margin-left:8px}nav{position:fixed;bottom:0;left:0;right:0;background:#fafaf6f5;backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:55px;padding:11px 15px max(11px,env(safe-area-inset-bottom));z-index:10}nav button{font-size:11px;color:var(--muted);min-width:65px;padding:5px}nav b{display:block;font-size:20px;font-weight:400;line-height:1.3;margin-bottom:3px}nav .selected{color:var(--accent);background:#e5edde;border-radius:14px}.fab{position:fixed;right:max(24px,calc((100vw - 1030px)/2));bottom:105px;border-radius:50%;width:55px;height:55px;font-size:29px;background:var(--ink);color:white;box-shadow:0 7px 20px #233d3628;z-index:11}.banner{font-size:12px;color:#6d725a;background:#efeedf;border-radius:10px;padding:9px 13px;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stats>div{background:white;border:1px solid var(--line);border-radius:17px;text-align:center;padding:20px 5px}.stats strong{display:block;font:32px Georgia,serif}.stats small{font-size:11px}.settings{max-width:650px}.settings section{margin-top:22px}.settings h3{font-size:15px;margin-bottom:10px}.settings .card{padding:20px}.help{font-size:12px;color:var(--muted);margin:10px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}dialog{border:1px solid var(--line);border-radius:24px;padding:26px;width:min(520px,calc(100% - 24px));max-height:88dvh;color:var(--ink);background:var(--bg)}dialog::backdrop{background:#10231d70;backdrop-filter:blur(4px)}dialog h2{font-size:22px}dialog .actions{justify-content:flex-end}.comment{padding:12px 0;border-bottom:1px solid var(--line)}.comment p{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.comment small{font-size:11px}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:50;background:var(--ink);color:white;max-width:90vw;width:max-content;padding:11px 20px;border-radius:15px;font-size:13px;box-shadow:0 5px 25px #0003}.search{margin-bottom:14px}.note{border-left:3px solid #c8d2bc;padding:5px 14px;margin:15px 0;color:var(--muted);font-size:13px}.date{font-size:12px;color:var(--muted)}@media(max-width:600px){.shell{padding:20px </style></head><body><div class="shell"><header><div class="logo"><h1>余白<span style="font-size:13px;margin-left:8px">YOHAKU</span></h1><small>人生で、やりたいこと。</small></div><button class="outline" id="accountBtn">ログイン</button></header><div id="mode"></div><main id="main"></main></div><button class="fab" id="addBtn" aria-label="やりたいことを追加">＋</button><nav aria-label="メインメニュー"><button data-page="home"><b>◷</b>わたしの人生</button><button data-page="discover"><b>✧</b>みんなの夢</button><button data-page="memories"><b>▧</b>達成の記録</button><button data-page="settings"><b>⚙</b>マイページ</button></nav><dialog id="modal"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
// 公開時は、専用Firebaseプロジェクトのウェブ設定をここに入れます。

const FIREBASE_CONFIG = null;

<script type="module">
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='yohaku-v1';const defaults={name:'',birth:'',age:85,display:'days',showLife:true,publicDefault:false};
let state={profile:{...defaults},dreams:[],blocked:[]};let storageOK=true;
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&raw.version===1)state={...state,...raw,profile:{...defaults,...raw.profile}}}catch{storageOK=false}
let page='home',filter='all',search='',user=null,cloud=null,publicDreams=[],publicCursor=null,morePublic=false,loading=false;
const categories=['旅・おでかけ','家族・友人','学び・仕事','趣味・挑戦','暮らし','その他'];
const uid=()=>globalThis.crypto?.randomUUID?.()||'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=globalThis.crypto.getRandomValues(new Uint8Array(1))[0]&15;return(c==='x'?r:(r&3)|8).toString(16)});const today=()=>new Date().toLocaleDateString('sv-SE');
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,4300)}
function error(e){console.error(e?.code||e?.name||'error');const map={'login-required':'ログインしてからお試しください。','auth/invalid-credential':'メールアドレスかパスワードを確認してください。','auth/email-already-in-use':'このメールアドレスは登録済みです。','auth/weak-password':'パスワードは8文字以上にしてください。','auth/invalid-email':'メールアドレスを確認してください。','permission-denied':'保存権限がありません。メール確認とデータベースのルール設定を確認してください。','auth/too-many-requests':'少し時間をおいてお試しください。'};toast(map[e?.code]||'処理に失敗しました。接続と設定を確認して、もう一度お試しください。')}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(cloud?{...JSON.parse(localStorage.getItem(KEY)||'{"version":1}'),blocked:state.blocked}:{...state,version:1}));storageOK=true;return true}catch{storageOK=false;toast('端末への保存に失敗しました。設定からバックアップを書き出してください。');return false}}
function labelFields(root){root.querySelectorAll('label').forEach((l,i)=>{const f=l.nextElementSibling;if(!l.querySelector('input')&&f?.matches('input,select,textarea')){f.id=f.id||root.id+'-field-'+i;l.htmlFor=f.id}})}
function modal(html){const d=$('#modal');d.innerHTML=html;labelFields(d);d.showModal()}function close(){$('#modal').close()}function empty(title,text,button=''){return `<div class="empty"><h3>${title}</h3><p>${text}</p>${button}</div>`}
function ageAt(date,birth){const d=new Date(date+'T00:00:00'),b=new Date(birth+'T00:00:00');return d.getFullYear()-b.getFullYear()-((d.getMonth()<b.getMonth()||(d.getMonth()===b.getMonth()&&d.getDate()<b.getDate()))?1:0)}
function lifeData(){const p=state.profile;if(!p.birth)return null;const b=new Date(p.birth+'T00:00:00'),end=new Date(b);end.setFullYear(b.getFullYear()+Number(p.age));const now=new Date(),days=Math.max(0,Math.ceil((end-now)/86400000));return {days,weeks:Math.ceil(days/7),years:(days/365.2425).toFixed(1),progress:Math.min(100,Math.max(0,(now-b)/(end-b)*100)),current:ageAt(today(),p.birth)}}
function lifeCard(){const p=state.profile,d=lifeData();if(!p.showLife)return '';if(!d)return `<section class="life"><div class="eyebrow">YOUR LIFE, YOUR PACE</div><h2>これからの時間に、<br>やりたいことを。</h2><p class="help">生年月日と目標年齢を設定して、人生の時間軸をつくりましょう。</p><button class="outline" data-settings>自分の時間を設定する →</button></section>`;return `<section class="life"><div class="row"><div class="eyebrow">これからの人生</div><button class="date" data-settings>目標 ${esc(p.age)}歳 ›</button></div><div class="number">${p.display==='weeks'?d.weeks.toLocaleString():p.display==='years'?d.years:d.days.toLocaleString()}<span>${p.display==='weeks'?'週間':p.display==='years'?'年':'日'}</span></div><div class="muted">まだ、出会っていない景色がある。</div><div class="track"><i style="width:${d.progress}%"></i></div><div class="row muted"><span>0歳</span><span>いま ${d.current}歳 · 人生の${Math.round(d.progress)}%</span><span>${esc(p.age)}歳</span></div><small style="font-size:10px;margin-top:12px">自分で設定した目標年齢までの時間です。</small></section>`}
function dueLabel(d){if(d.done)return `✓ ${esc(d.doneDate||'')} 達成`;if(!d.due)return 'いつか、きっと';const days=Math.ceil((new Date(d.due+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);return days<0?'予定を見直す':days===0?'今日が目標日':`あと ${days.toLocaleString()}日`}
function card(d,shared=false){return `<article class="card"><div class="row category"><span>${esc(d.category)}</span><span>${shared?esc(d.authorName||'ななし'):d.visibility==='public'?'全体公開':'自分だけ'}</span></div><h3>${esc(d.title)}</h3>${d.note?`<p>${esc(d.note)}</p>`:''}${d.step&&!d.done?`<div class="note">最初の一歩：${esc(d.step)}</div>`:''}${d.memory&&d.done?`<div class="note">${esc(d.memory)}</div>`:''}<div class="row wrap"><span class="tag ${d.done?'done':''}">${dueLabel(d)}</span>${d.budget?`<span class="date">予算 ¥${Number(d.budget).toLocaleString()}</span>`:''}</div><footer>${shared?`<button data-cheer="${esc(d.id)}">♡ 応援</button><button data-comments="${esc(d.id)}">コメント</button><button data-report="${esc(d.id)}" aria-label="この投稿を通報">⋯</button>`:`<button data-edit="${esc(d.id)}">編集する</button><button data-complete="${esc(d.id)}">${d.done?'未達成に戻す':'叶えた！ ✓'}</button>`}</footer></article>`}
function filteredDreams(){return state.dreams.filter(d=>(filter==='all'||(filter==='done'?d.done:!d.done))&&(!search||(d.title+' '+d.note).includes(search))).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'))}
function home(){const ds=filteredDreams();let groups=new Map();for(const d of ds){let group='いつか叶えたい';if(d.due)group=state.profile.birth?`${Math.floor(ageAt(d.due,state.profile.birth)/10)*10}代`:`${d.due.slice(0,4)}年`;if(!groups.has(group))groups.set(group,[]);groups.get(group).push(d)}return `${lifeCard()}<div class="intro row"><div><div class="eyebrow">MY BUCKET LIST</div><h2>わたしの、やりたいこと。</h2></div><span class="pill">${state.dreams.length} の夢</span></div>${filters()}<input class="search" id="search" aria-label="夢を検索" placeholder="やりたいことを探す" value="${esc(search)}">${ds.length?`<div class="timeline">${[...groups].map(([g,items])=>`<div class="period">${g}<span>${items.length} の夢</span></div><div class="grid">${items.map(d=>card(d)).join('')}</div>`).join('')}</div>`:empty('小さな「やってみたい」から。','遠くへの旅も、大切な人とのごはんも。<br>思いついたことを、ひとつ残してみましょう。','<button class="primary" data-add>最初の夢を追加する ＋</button>')}`}
function filters(){return `<div class="tabs">${[['all','すべて'],['todo','これから'],['done','叶えた']].map(([v,t])=>`<button data-filter="${v}" class="${filter===v?'active':''}">${t}</button>`).join('')}</div>`}
function discover(){return `<div class="intro"><div class="eyebrow">DREAMS CONNECT US</div><h2>誰かの夢が、きっかけになる。</h2><p class="help">やってみたいを分けあって、お互いの一歩を応援しよう。</p></div>${!cloud?empty('みんなの夢は、接続後に。','いまは端末内で試すモードです。<br>公開設定を選んでも、外部には送信されません。<br>共有機能の接続手順は同梱の案内にまとめています。'): `<div class="row"><small>公開された夢 · ${publicDreams.length}件を表示</small><button class="outline" id="refreshPublic">更新する</button></div><p class="help">表示したくない投稿は「⋯」から非表示・通報できます。</p><div class="grid">${publicDreams.filter(d=>!state.blocked.includes(d.ownerId)).map(d=>card(d,true)).join('')}</div>${!publicDreams.length?empty('最初の夢を待っています。','公開範囲を「全体公開」にすると、ここに夢が並びます。'):''}${morePublic?'<button class="outline" id="loadMore" style="margin-top:20px">もっと見る</button>':''}`}`}
function memories(){const ds=state.dreams.filter(d=>d.done).sort((a,b)=>(b.doneDate||'').localeCompare(a.doneDate||''));return `<div class="intro"><div class="eyebrow">THE DAYS YOU MADE IT HAPPEN</div><h2>叶えてきたこと。</h2><p class="help">あのときの「いつか」が、いまの思い出。</p></div><div class="stats"><div><strong>${ds.length}</strong><small>叶えた夢</small></div><div><strong>${ds.filter(d=>d.doneDate?.startsWith(String(new Date().getFullYear()))).length}</strong><small>今年の達成</small></div><div><strong>${state.dreams.length?Math.round(ds.length/state.dreams.length*100):0}<span style="font-size:14px">%</span></strong><small>達成率</small></div></div>${ds.length?`<div class="grid">${ds.map(d=>card(d)).join('')}</div>`:empty('これから、増えていく思い出。','夢を叶えたら「叶えた！」から記録を残せます。')}`}
function settings(){const p=state.profile;return `<div class="intro"><div class="eyebrow">MY PAGE</div><h2>自分のペースを、大切に。</h2></div><div class="settings"><form id="profileForm"><section class="card"><h3>プロフィール</h3><label>ニックネーム（公開した夢に表示）</label><input name="name" maxlength="30" value="${esc(p.name)}" placeholder="ニックネーム"><label>生年月日（自分だけ）</label><input name="birth" type="date" max="${today()}" value="${esc(p.birth)}"><label>目標年齢</label><input name="age" type="number" min="1" max="120" required value="${esc(p.age)}"><label>残り時間の表示</label><select name="display">${[['days','日数'],['weeks','週数'],['years','年数']].map(([v,t])=>`<option value="${v}" ${p.display===v?'selected':''}>${t}</option>`).join('')}</select><label><input type="checkbox" name="showLife" style="width:auto;min-height:0" ${p.showLife?'checked':''}> 残り時間を表示する</label><label>新しい夢の公開範囲</label><select name="publicDefault"><option value="false">自分だけ</option><option value="true" ${p.publicDefault?'selected':''}>全体公開</option></select><p class="help">生年月日・目標年齢・メールアドレスは公開の夢に含めません。</p><div class="actions"><button class="primary">設定を保存</button></div></section></form><section class="card"><h3>アカウントと保存</h3><p class="help">${user?esc(user.email)+'<br>'+ (user.emailVerified?'メール確認済み':'メールの確認が必要です。確認後に再ログインしてください。'):cloud?'ログインすると複数端末で同じ記録を利用できます。':'端末内に保存中。ブラウザのデータ消去に備え、書き出しをご利用ください。'}</p><div class="actions"><button class="outline" data-auth>${user?'ログアウト':'ログイン・新規登録'}</button>${user&&!user.emailVerified?'<button class="outline" id="verify">確認メールを再送</button>':''}</div></section><section class="card"><h3>記録のバックアップ</h3><p class="help">設定と自分の夢をJSON形式で書き出します。公開コメント・応援は含みません。読み込みは端末内モードで利用できます。</p><div class="actions"><button class="outline" id="export">書き出す ↓</button><button class="outline" id="import" ${cloud?'disabled':''}>読み込む ↑</button></div><input id="importFile" type="file" accept="application/json,.json" hidden></section><section class="card"><h3>表示しないユーザー</h3><p class="help">${state.blocked.length} 人をこの端末で非表示にしています。</p><button class="outline" id="unblock">非表示をすべて解除</button></section><p class="help">余白 v0.1 · 初版<br>AIレポート・写真添付・通知は、この初版には含まれていません。</p></div>`}
function render(){const m=$('#mode');m.className='banner';m.textContent=!storageOK?'端末に保存できていません。バックアップを書き出してください。':cloud?(user?'クラウド接続中 · '+(user.emailVerified?'確認済みアカウント':'メール確認をお願いします'):'クラウド接続中 · 閲覧できます。登録・投稿にはログインしてください。'):'端末内でお試し中 · 他の人への公開・共有はまだ行われません';$('#accountBtn').textContent=user?'アカウント':'ログイン';$('#main').innerHTML=({home,discover,memories,settings}[page])();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('selected',b.dataset.page===page));bind()}
function navigate(p){page=p;filter='all';search='';render();window.scrollTo(0,0);if(p==='discover'&&cloud)loadPublic()}
async function busy(form,fn){const b=form.querySelector('button[type="submit"],button.primary');if(b)b.disabled=true;try{await fn()}catch(e){error(e)}finally{if(b)b.disabled=false}}
function editor(id){const old=state.dreams.find(d=>d.id===id),d=old||{category:categories[0],visibility:state.profile.publicDefault?'public':'private'};modal(`<form id="dreamForm"><div class="row"><h2>${old?'夢を編集する':'やってみたいを、ひとつ。'}</h2><button type="button" data-close aria-label="閉じる">✕</button></div><label>やりたいこと</label><input name="title" required maxlength="100" value="${esc(d.title)}" placeholder="例：家族で星空の下に泊まる"><label>カテゴリー</label><select name="category">${categories.map(c=>`<option ${d.category===c?'selected':''}>${c}</option>`).join('')}</select><label>想い・メモ</label><textarea name="note" maxlength="2000" rows="3" placeholder="なぜ、やってみたい？">${esc(d.note)}</textarea><div class="row"><div style="width:55%"><label>いつまでに（任意）</label><input type="date" name="due" value="${esc(d.due)}"></div><div style="width:45%"><label>予算・円（任意）</label><input name="budget" type="number" min="0" max="999999999" value="${d.budget||''}"></div></div><label>最初の一歩</label><input name="step" maxlength="200" value="${esc(d.step)}" placeholder="まずは、場所を3つ調べる"><label>公開範囲</label><select name="visibility"><option value="private">自分だけ</option><option value="public" ${d.visibility==='public'?'selected':''}>全体公開</option></select><p class="help">${cloud?'全体公開の夢は、ログインしていない人も閲覧できます。公開メモに個人情報を書かないでください。':'いまはお試しモードのため、全体公開を選んでも端末内だけに保存します。'}</p><div class="actions">${old?'<button type="button" class="outline danger" id="deleteDream">削除する</button>':''}<button type="submit" class="primary">保存する</button></div></form>`);$('#dreamForm').onsubmit=e=>{e.preventDefault();busy(e.currentTarget,async()=>{const f=new FormData(e.target),data={id:old?.id||uid(),title:f.get('title').trim(),category:f.get('category'),note:f.get('note').trim(),due:f.get('due'),budget:Number(f.get('budget')||0),step:f.get('step').trim(),visibility:f.get('visibility'),done:old?.done||false,doneDate:old?.doneDate||'',memory:old?.memory||'',createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()};if(!data.title)return toast('やりたいことを入力してください。');await saveDream(data);close();render();toast('夢を保存しました。')})};if(old)$('#deleteDream').onclick=async()=>{if(!confirm('この夢を削除しますか？元に戻せません。'))return;try{if(cloud){requireUser();await cloud.deleteDoc(cloud.doc(cloud.db,'dreams',id))}state.dreams=state.dreams.filter(d=>d.id!==id);if(!cloud)persist();close();render();toast('削除しました。')}catch(e){error(e)}};bindClose()}
function requireUser(){if(!user)throw {code:'login-required'};if(!user.emailVerified)throw {code:'permission-denied'}}
async function saveDream(d){if(cloud){requireUser();await cloud.setDoc(cloud.doc(cloud.db,'dreams',d.id),{...d,ownerId:user.uid,authorName:state.profile.name||'ななし'})}const i=state.dreams.findIndex(x=>x.id===d.id);if(i<0)state.dreams.push(d);else state.dreams[i]=d;if(!cloud)persist()}
async function complete(id){const d=state.dreams.find(x=>x.id===id);if(d.done){if(!confirm('この夢を未達成に戻しますか？達成メモは残ります。'))return;try{await saveDream({...d,done:false,doneDate:'',updatedAt:Date.now()});render()}catch(e){error(e)}return}modal(`<form id="completeForm"><h2>その夢、叶えたんですね。</h2><p class="help">${esc(d.title)}</p><label>叶えた日</label><input name="date" type="date" required max="${today()}" value="${today()}"><label>いまの気持ちを、未来の自分へ。</label><textarea name="memory" maxlength="2000" rows="4">${esc(d.memory)}</textarea><p class="help">全体公開の夢では、この記録も公開されます。</p><div class="actions"><button type="button" data-close class="outline">キャンセル</button><button type="submit" class="primary">達成を記録する ✓</button></div></form>`);bindClose();$('#completeForm').onsubmit=e=>{e.preventDefault();busy(e.currentTarget,async()=>{const f=new FormData(e.target);await saveDream({...d,done:true,doneDate:f.get('date'),memory:f.get('memory').trim(),updatedAt:Date.now()});close();render();toast('おめでとうございます。大切な思い出が増えました。')})}}
function authDialog(){if(user){if(confirm('ログアウトしますか？'))cloud.signOut(cloud.auth).catch(error);return}if(!cloud){modal('<h2>まずは、端末内で試せます。</h2><p class="help">アカウント機能とみんなの共有には、Firebaseへの接続が必要です。同梱の「はじめかた」を使って接続します。</p><div class="actions"><button class="primary" data-close>お試しを続ける</button></div>');bindClose();return}modal(`<form id="authForm"><div class="row"><h2>自分の記録を、つなぐ。</h2><button type="button" data-close>✕</button></div><label>メールアドレス</label><input name="email" type="email" autocomplete="email" required><label>パスワード（8文字以上）</label><input name="password" type="password" autocomplete="current-password" minlength="8" required><label>操作</label><select name="action"><option value="login">ログイン</option><option value="signup">新規登録</option></select><p class="help">新規登録後、確認メールのリンクを開いて再ログインしてください。端末内のお試し記録は自動ではアカウントに移りません。先にバックアップを書き出してください。</p><div class="actions"><button type="button" class="outline" id="resetPassword">パスワード再設定</button><button class="primary" type="submit">続ける</button></div></form>`);bindClose();$('#resetPassword').onclick=async()=>{const email=$('#authForm').elements.email.value;if(!email)return toast('メールアドレスを入力してください。');try{await cloud.sendPasswordResetEmail(cloud.auth,email);toast('再設定を受け付けました。メールをご確認ください。')}catch(e){error(e)}};$('#authForm').onsubmit=e=>{e.preventDefault();busy(e.currentTarget,async()=>{const f=new FormData(e.target);if(f.get('action')==='signup'){const c=await cloud.createUserWithEmailAndPassword(cloud.auth,f.get('email'),f.get('password'));await cloud.sendEmailVerification(c.user);toast('確認メールを送りました。確認後に再ログインしてください。')}else await cloud.signInWithEmailAndPassword(cloud.auth,f.get('email'),f.get('password'));close()})}}
async function loadPublic(append=false){if(!cloud||loading)return;loading=true;try{const args=[cloud.where('visibility','==','public'),cloud.orderBy('createdAt','desc'),cloud.limit(20)];if(append&&publicCursor)args.push(cloud.startAfter(publicCursor));const snap=await cloud.getDocs(cloud.query(cloud.collection(cloud.db,'dreams'),...args));publicDreams=append?[...publicDreams,...snap.docs.map(d=>({...d.data(),id:d.id}))]:snap.docs.map(d=>({...d.data(),id:d.id}));publicCursor=snap.docs.at(-1)||null;morePublic=snap.docs.length===20;if(page==='discover')render()}catch(e){error(e)}finally{loading=false}}
async function cheer(id){if(!user)return authDialog();try{requireUser();const ref=cloud.doc(cloud.db,'dreams',id,'cheers',user.uid),s=await cloud.getDoc(ref);if(s.exists()){await cloud.deleteDoc(ref);toast('応援を取り消しました。')}else{await cloud.setDoc(ref,{ownerId:user.uid,createdAt:Date.now()});toast('応援を届けました ♡')}}catch(e){error(e)}}
async function comments(id){if(!cloud)return;modal(`<h2>夢に、ひとこと。</h2><div id="commentsList"><p class="help">読み込み中…</p></div><form id="commentForm"><label>応援のコメント</label><textarea name="text" required maxlength="500" rows="3" placeholder="その夢、すてきですね！"></textarea><p class="help">コメントは公開されます。自分のコメントは削除できます。</p><div class="actions"><button type="button" class="outline" data-close>閉じる</button><button class="primary" type="submit">投稿する</button></div></form>`);bindClose();const load=async()=>{try{const ss=await cloud.getDocs(cloud.query(cloud.collection(cloud.db,'dreams',id,'comments'),cloud.orderBy('createdAt','desc'),cloud.limit(50)));$('#commentsList').innerHTML=ss.empty?'<p class="help">まだコメントはありません。</p>':ss.docs.filter(x=>!state.blocked.includes(x.data().ownerId)).map(x=>{const c=x.data();return `<div class="comment"><small>${esc(c.authorName)} · ${new Date(c.createdAt).toLocaleDateString('ja-JP')}</small><p>${esc(c.text)}</p><button class="date" data-comment-report="${esc(x.id)}">通報</button> ${c.ownerId===user?.uid?`<button class="date" data-comment-delete="${esc(x.id)}">削除</button>`:''}</div>`}).join('');document.querySelectorAll('[data-comment-delete]').forEach(b=>b.onclick=async()=>{try{await cloud.deleteDoc(cloud.doc(cloud.db,'dreams',id,'comments',b.dataset.commentDelete));await load()}catch(e){error(e)}});document.querySelectorAll('[data-comment-report]').forEach(b=>b.onclick=()=>report(id,b.dataset.commentReport))}catch(e){if($('#commentsList'))$('#commentsList').textContent='読み込みに失敗しました。';error(e)}};await load();$('#commentForm').onsubmit=e=>{e.preventDefault();if(!user){close();authDialog();return}busy(e.currentTarget,async()=>{requireUser();const text=e.target.elements.text.value.trim();if(!text)return;await cloud.setDoc(cloud.doc(cloud.collection(cloud.db,'dreams',id,'comments')),{ownerId:user.uid,authorName:state.profile.name||'ななし',text,createdAt:Date.now()});e.target.reset();await load()})}}
function report(id,commentId=''){const d=publicDreams.find(d=>d.id===id);modal(`<form id="reportForm"><h2>投稿について</h2><p class="help">通報は管理者だけに送信されます。非表示はこの端末に適用されます。</p><label>理由</label><select name="reason"><option>迷惑行為・スパム</option><option>嫌がらせ・不適切な内容</option><option>個人情報</option><option>その他</option></select><div class="actions"><button type="button" data-close class="outline">戻る</button>${d&&!commentId?'<button type="button" class="outline" id="blockUser">この人を非表示</button>':''}<button class="primary" type="submit">通報する</button></div></form>`);bindClose();if($('#blockUser'))$('#blockUser').onclick=()=>{state.blocked=[...new Set([...state.blocked,d.ownerId])];persist();close();render();toast('このユーザーを非表示にしました。')};$('#reportForm').onsubmit=e=>{e.preventDefault();if(!user){close();authDialog();return}busy(e.currentTarget,async()=>{requireUser();await cloud.setDoc(cloud.doc(cloud.collection(cloud.db,'reports')),{reporter:user.uid,dreamId:id,commentId,reason:e.target.elements.reason.value,createdAt:Date.now()});close();toast('通報を受け付けました。')})}}
function bindClose(){document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close)}
function bind(){labelFields($('#main'));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>startEditor());document.querySelectorAll('[data-settings]').forEach(b=>b.onclick=()=>navigate('settings'));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editor(b.dataset.edit));document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>complete(b.dataset.complete));document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=authDialog);document.querySelectorAll('[data-cheer]').forEach(b=>b.onclick=()=>cheer(b.dataset.cheer));document.querySelectorAll('[data-comments]').forEach(b=>b.onclick=()=>comments(b.dataset.comments));document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>report(b.dataset.report));if($('#search')){const updateSearch=e=>{if(e.isComposing)return;const pos=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$('#search').oninput=updateSearch;$('#search').oncompositionend=updateSearch};if($('#refreshPublic'))$('#refreshPublic').onclick=()=>loadPublic();if($('#loadMore'))$('#loadMore').onclick=()=>loadPublic(true);
if($('#profileForm'))$('#profileForm').onsubmit=e=>{e.preventDefault();busy(e.currentTarget,async()=>{const f=new FormData(e.target),p={name:f.get('name').trim(),birth:f.get('birth'),age:Number(f.get('age')),display:f.get('display'),showLife:f.has('showLife'),publicDefault:f.get('publicDefault')==='true'};if(p.birth&&(p.birth>today()||p.age<=ageAt(today(),p.birth)))return toast('目標年齢は、現在の年齢より大きくしてください。');if(cloud){requireUser();await cloud.setDoc(cloud.doc(cloud.db,'users',user.uid),p)}state.profile=p;if(!cloud)persist();render();toast('設定を保存しました。')})};if($('#export'))$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,profile:state.profile,dreams:state.dreams},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yohaku-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)};if($('#import'))$('#import').onclick=()=>$('#importFile').click();if($('#importFile'))$('#importFile').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>10000000)throw new Error('size');const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.dreams)||!data.profile||data.dreams.length>10000)throw new Error('format');const p=data.profile;if(typeof p.name!=='string'||p.name.length>30||typeof p.birth!=='string'||(p.birth&&!/^\d{4}-\d{2}-\d{2}$/.test(p.birth))||!Number.isFinite(p.age)||p.age<1||p.age>120||!['days','weeks','years'].includes(p.display)||typeof p.showLife!=='boolean'||typeof p.publicDefault!=='boolean')throw new Error('profile');for(const d of data.dreams){if(typeof d.id!=='string'||!/^[a-zA-Z0-9-]{1,100}$/.test(d.id)||typeof d.title!=='string'||!d.title.trim()||d.title.length>100||typeof d.note!=='string'||d.note.length>2000||!categories.includes(d.category)||typeof d.due!=='string'||(d.due&&!/^\d{4}-\d{2}-\d{2}$/.test(d.due))||!Number.isFinite(d.budget)||d.budget<0||typeof d.step!=='string'||d.step.length>200||!['public','private'].includes(d.visibility)||typeof d.done!=='boolean'||typeof d.doneDate!=='string'||typeof d.memory!=='string'||d.memory.length>2000||!Number.isFinite(d.createdAt)||!Number.isFinite(d.updatedAt))throw new Error('dream')};if(!confirm('現在の端末内の記録を、バックアップの内容で置き換えますか？'))return;state.profile={...defaults,...p};state.dreams=data.dreams;persist();render();toast('バックアップを読み込みました。')}catch{toast('読み込めませんでした。余白から書き出したJSONを選んでください。')}};if($('#unblock'))$('#unblock').onclick=()=>{state.blocked=[];persist();render()};if($('#verify'))$('#verify').onclick=()=>cloud.sendEmailVerification(user).then(()=>toast('確認メールを送りました。')).catch(error)}
function startEditor(){if(cloud&&!user)return authDialog();if(cloud&&!user.emailVerified)return toast('確認メールのリンクを開いてから、再ログインしてください。');editor()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('#addBtn').onclick=startEditor;$('#accountBtn').onclick=authDialog;
render();
if(FIREBASE_CONFIG){try{const base='https://www.gstatic.com/firebasejs/12.19.0/';const [app,auth,db]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);const inst=app.initializeApp(FIREBASE_CONFIG);cloud={...auth,...db,auth:auth.getAuth(inst),db:db.getFirestore(inst)};let authGeneration=0;cloud.onAuthStateChanged(cloud.auth,async u=>{const generation=++authGeneration;user=u;publicDreams=[];state.dreams=[];state.profile={...defaults};try{if(u){const [p,ds]=await Promise.all([cloud.getDoc(cloud.doc(cloud.db,'users',u.uid)),cloud.getDocs(cloud.query(cloud.collection(cloud.db,'dreams'),cloud.where('ownerId','==',u.uid)))]);if(generation!==authGeneration)return;if(p.exists())state.profile={...defaults,...p.data()};state.dreams=ds.docs.map(d=>({...d.data(),id:d.id}))}}catch(e){error(e)}if(generation!==authGeneration)return;render();if(page==='discover')loadPublic()})}catch(e){cloud=null;error(e);toast('共有機能に接続できません。端末内モードで開きました。');render()}}
</script></body></html>
