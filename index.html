function sampleState(){const y=new Date().getFullYear();return{version:2,profile:{...defaults,name:'サンプル',birth:(y-30)+'-06-01'},groups:[{id:'sample-couple',name:'ふたりの余白',note:'ふたりで楽しみにしていること。'}],entries:[{id:'s1',type:'memory',title:'ふたりの、新しいはじまり。',note:'この日の気持ちを、これからも忘れずに。',privateNote:'',category:'人生の節目',precision:'month',date:(y-3)+'-05',targetAge:null,groupIds:['sample-couple'],joint:false,photos:[sampleSvg('#c0b2a0','#879481','OUR BEGINNING')],createdAt:1},{id:'s2',type:'memory',title:'海を眺めて、ひと休み。',note:'何もしない時間も、いい思い出。',privateNote:'',category:'旅・おでかけ',precision:'day',date:y+'-08-12',targetAge:null,groupIds:[],joint:false,photos:[sampleSvg('#9eb5b1','#668c8a','A DAY BY THE SEA')],createdAt:2},{id:'s3',type:'dream',title:'家族で、星空の下に泊まる。',note:'夜はスマホをしまって、みんなで空を見たい。',privateNote:'',category:'家族・友人',precision:'year',date:String(y+1),targetAge:null,groupIds:['sample-couple'],joint:true,step:'泊まれる場所を3つ調べる',budget:50000,photos:[],createdAt:3},{id:'s4',type:'dream',title:'いつか、長い旅に出る。',note:'行き先を決めず、ゆっくり。',privateNote:'',category:'旅・おでかけ',precision:'someday',date:'',targetAge:null,groupIds:[],joint:false,photos:[],createdAt:4}]}}

function entryYear(e){if(e.precision==='someday')return null;if(e.precision==='age'||e.precision==='decade')return state.profile.birth?startYear()+Number(e.targetAge):null;return e.date?Number(e.date.slice(0,4)):null}

function dateLabel(e){if(e.precision==='someday')return'いつか';if(e.precision==='age')return `${esc(e.targetAge)}歳ごろ`;if(e.precision==='decade')return `${esc(e.targetAge)}代`;const [y,m,d]=(e.date||'').split('-');return e.precision==='year'?`${y}年ごろ`:e.precision==='month'?`${y}年${Number(m)}月ごろ`:`${y}年${Number(m)}月${Number(d)}日`}
function sharedLabel(e){const names=(e.groupIds||[]).map(id=>state.groups.find(g=>g.id===id)?.name).filter(Boolean);return names.length?names.join('・'):'自分だけ'}

function lifeHero(){const p=state.profile,mem=state.entries.filter(e=>e.type==='memory').length,dream=state.entries.filter(e=>e.type==='dream').length;if(!p.birth)return `<section class="hero"><div class="eyebrow">YOUR LIFE, YOUR PACE</div><h2>あの日のことも、<br>これからのことも。</h2><p class="lead">思い出と夢を、ひとつの年表に。</p><div class="actions" style="justify-content:flex-start;margin-top:17px"><button class="primary" data-settings>自分の時間を設定 ${icon('chevron')}</button></div><div class="hero-foot"><span><strong>${mem}</strong>思い出</span><span><strong>${dream}</strong>これからの夢</span></div></section>`;let b=new Date(p.birth+'T00:00:00'),end=new Date(b);end.setFullYear(end.getFullYear()+Number(p.age));const now=new Date(),days=Math.max(0,Math.ceil((end-now)/86400000)),progress=Math.min(100,Math.max(0,(now-b)/(end-b)*100));return `<section class="hero"><div class="row"><div class="eyebrow">${p.showLife?'これからの人生':'MY LIFE STORY'}</div><button class="subtle" data-settings>目標 ${esc(p.age)}歳 ›</button></div>${p.showLife?`<div class="row"><div class="count">${p.display==='weeks'?Math.ceil(days/7).toLocaleString():p.display==='years'?(days/365.2425).toFixed(1):days.toLocaleString()}<small>${p.display==='weeks'?'週間':p.display==='years'?'年':'日'}</small></div>${icon('leaf')}</div><small>まだ、出会っていない景色がある。</small><div class="bar"><i style="width:${progress}%"></i></div><div class="row"><small>0歳</small><small>いま ${ageAt(today(),p.birth)}歳</small><small>${esc(p.age)}歳</small></div>`:`<h2>これまでと、これからを。</h2>`}<div class="hero-foot"><span><strong>${mem}</strong>思い出</span><span><strong>${dream}</strong>これからの夢</span></div>${p.showLife?'<p class="help" style="font-size:9px;margin-top:8px">自分で設定した目標年齢までの時間です。</p>':''}</section>`}
function card(e,inGroup=false){const photo=e.photos?.[0];return `<article class="entry ${e.type}">${photo?`<button style="display:block;width:100%;padding:0" data-detail="${esc(e.id)}" ${inGroup?'data-group-view="1"':''} aria-label="${esc(e.title)}の写真と詳細"><img class="cover" loading="lazy" src="${esc(photo)}" alt="${esc(e.title)}に添えた写真"></button>`:''}<div class="entry-main" data-detail="${esc(e.id)}" ${inGroup?'data-group-view="1"':''} role="button" tabindex="0" aria-label="${esc(e.title)}の詳細"><div class="entry-meta"><span>${e.type==='memory'?'● 思い出':'◇ これから'} · ${esc(e.category)}</span><span>${e.photos?.length?icon('photo')+`<span class="photo-count">${e.photos.length}</span>`:''}</span></div><h3>${esc(e.title)}</h3>${e.note?`<p>${esc(e.note.length>120?e.note.slice(0,120)+'…':e.note)}</p>`:''}${e.reflection?`<p>${esc(e.reflection.length>100?e.reflection.slice(0,100)+'…':e.reflection)}</p>`:''}${e.type==='dream'&&e.step?`<div class="entry-step">最初の一歩：${esc(e.step)}</div>`:''}<div style="margin-top:12px" class="row wrap"><span class="pill ${e.type==='memory'?'gold':''}">${dateLabel(e)}</span><small style="font-size:9px">${e.joint?'一緒の夢 · ':''}${esc(sharedLabel(e))}</small></div>${e.originDream?'<div class="achieved-label">✓ やりたかったことが、思い出に。</div>':''}</div><footer><button data-edit="${esc(e.id)}">編集する</button><button ${e.type==='dream'?`data-achieve="${esc(e.id)}"`:`data-detail="${esc(e.id)}"`} ${inGroup?'data-group-view="1"':''}>${e.type==='dream'?'叶えた！ '+icon('check'):'思い出をひらく '+icon('chevron')}</button></footer></article>`}
function blank(title,text,btn=''){return `<div class="empty"><h3>${title}</h3><p>${text}</p>${btn}</div>`}

function yearBlock(y,entries){const ds=entries.filter(e=>entryYear(e)===y),isNow=y===new Date().getFullYear();return `<section class="year" id="year-${y}"><div class="year-label"><span><strong>${y}</strong> <small> · ${yearAge(y)}</small></span>${isNow?'<span class="now">いま</span>':''}</div>${familyAges(y)}${ds.length?`<div class="cards">${ds.map(e=>card(e)).join('')}</div><button class="between" data-add-year="${y}" aria-label="${y}年に追加">＋ この年に追加</button>`:`<button class="blank-add" data-add-year="${y}">＋ ${y<=new Date().getFullYear()?'この年の思い出・夢を残す':'この年に、やりたいことを置く'}</button>`}</section>`}
function yearOptions(){const es=state.entries.map(entryYear).filter(Number.isFinite);const min=Math.min(startYear(),...es),max=Math.max(finalYear(),...es,new Date().getFullYear());let out='';for(let y=min;y<=max;y++)out+=`<option value="${y}" ${y===selectedYear?'selected':''}>${y}年${state.profile.birth?' · '+(y-startYear())+'歳':''}</option>`;return out}
function timeline(){const ds=getEntries(),now=new Date().getFullYear();let rewind=state.entries.find(e=>e.type==='memory'&&e.date&&e.precision==='day'&&e.date.slice(5)===today().slice(5)&&entryYear(e)<now);let body='';if(scale==='life'){const years=ds.map(entryYear).filter(Number.isFinite),first=Math.min(0,...years.map(decadeFor)),last=Math.max(Number(state.profile.age||85),...years.map(y=>y-startYear()),now-startYear());for(let a=first;a<=last;a+=10){const sy=startYear()+a,ey=Math.min(startYear()+a+9,Math.max(finalYear(),...years,now)),items=ds.filter(e=>{const y=entryYear(e);return y!==null&&y>=sy&&y<=ey}),isNow=now>=sy&&now<=ey,open=openDecades.has(a);body+=`<section class="decade ${isNow?'current':''}" id="decade-${a}"><button class="decade-head" data-decade="${a}" aria-expanded="${open}"><div><div class="decade-title">${state.profile.birth?`${a}–${ey-startYear()}<span>歳</span>`:`${sy}<span>– ${ey}年</span>`}</div><div class="decade-sub">${state.profile.birth?`${sy} – ${ey}年 · `:''}${items.length?'思い出 '+items.filter(e=>e.type==='memory').length+' / 夢 '+items.filter(e=>e.type==='dream').length:'まだ、書かれていない余白'}</div></div><div class="row" style="gap:10px">${isNow?'<span class="pill">いま、ここ</span>':''}<span style="font-size:17px;color:#89977e">${open?'−':'＋'}</span></div></button>${open?`<div class="years">${Array.from({length:ey-sy+1},(_,i)=>yearBlock(sy+i,ds)).join('')}</div>`:items.length?`<div class="decade-preview">${items.find(e=>e.photos?.length)?`<img src="${esc(items.find(e=>e.photos?.length).photos[0])}" alt="">`:''}<span>${items.slice(0,2).map(e=>esc(e.title)).join(' ／ ')}${items.length>2?' ほか':''}</span></div>`:''}</section>`}body=`<div class="timeline">${body}</div>`}else{const annual=ds.filter(e=>entryYear(e)===selectedYear);const vague=annual.filter(e=>['year','age','decade'].includes(e.precision));body=`<div class="intro row"><div><h2>${selectedYear}<span style="font:13px sans-serif">年の余白</span></h2><p class="lead">${yearAge(selectedYear)}</p></div><button class="button" data-add-year="${selectedYear}">＋ この年に追加</button></div>${familyAges(selectedYear)}${vague.length?`<div class="section-head"><small>この年に残したこと</small></div><div class="cards">${vague.map(e=>card(e)).join('')}</div>`:''}<div class="timeline">${Array.from({length:12},(_,i)=>{const m=String(i+1).padStart(2,'0'),ms=annual.filter(e=>e.date?.slice(5,7)===m&&!['year','age','decade'].includes(e.precision));return `<section class="month"><div class="month-head">${i+1}月</div>${ms.length?`<div class="cards">${ms.map(e=>card(e)).join('')}</div>`:''}<button class="between" data-add-month="${selectedYear}-${m}">＋ ${i+1}月に追加</button></section>`}).join('')}</div>`}const someday=ds.filter(e=>entryYear(e)===null);return `${lifeHero()}${rewind?`<div class="rewind" role="button" tabindex="0" data-detail="${esc(rewind.id)}"><small>ON THIS DAY · ${now-entryYear(rewind)}年前の今日</small><p>${esc(rewind.title)}　→</p></div>`:''}<div class="intro row"><div><div class="eyebrow">MY LIFE STORY</div><h2>これまでと、これから。</h2></div><button class="subtle" id="familyToggle">${showFamily?'共有予定も表示':'自分だけ表示'} ▾</button></div><div class="toolbar"><div class="row"><div class="segments"><button data-scale="life" class="${scale==='life'?'active':''}">人生全体</button><button data-scale="year" class="${scale==='year'?'active':''}">1年を詳しく</button></div><div class="jump"><select id="yearJump" aria-label="見たい年">${yearOptions()}</select><button id="goNow" class="button">いま</button></div></div></div>${filterBar(true)}${!state.entries.length?`<p class="help" style="margin-bottom:22px">年代を開いて、年の間の「＋」から記録できます。<br>生年月日が未設定の場合は、仮の期間を表示しています。</p>`:''}${body}<section class="someday"><div class="section-head row"><h3>いつかボックス</h3><button class="subtle" data-someday>＋ 追加する</button></div><p class="help" style="margin-bottom:14px">まだ時期を決めていない夢も、そのままで。</p>${someday.length?`<div class="cards">${someday.map(e=>card(e)).join('')}</div>`:blank('「いつか」も、大切な予定。','思いついたことを、ここであたためておこう。','<button class="button" data-someday>いつかの夢を追加</button>')}</section>`}
function filterBar(forTimeline=false){return `<div class="filters">${[['all','すべて'],['memory','思い出'],['dream','これから']].map(([v,t])=>`<button data-filter="${v}" class="${filter===v?'active':''}">${t}</button>`).join('')}</div>${!forTimeline?`<input class="search" id="search" aria-label="タイトルやメモを検索" placeholder="タイトルやメモを検索" value="${esc(search)}">`:''}`}
function dreams(){const ds=getEntries().filter(e=>e.type==='dream').sort((a,b)=>(entryYear(a)??9999)-(entryYear(b)??9999)),mem=state.entries.filter(e=>e.type==='memory'&&e.originDream).length;return `<div class="intro"><div class="eyebrow">THINGS I WANT TO DO</div><h2>やってみたいを、育てる。</h2><p class="lead">小さな一歩から、いつかの大きな夢まで。</p></div><div class="stat-grid"><div><strong>${state.entries.filter(e=>e.type==='dream').length}</strong><small>これからの夢</small></div><div><strong>${mem}</strong><small>叶えた夢</small></div><div><strong>${state.entries.filter(e=>e.type==='dream'&&(e.groupIds||[]).length).length}</strong><small>共有予定の夢</small></div></div><input class="search" id="search" aria-label="タイトルやメモを検索" placeholder="やりたいことを探す" value="${esc(search)}">${ds.length?`<div class="cards">${ds.map(e=>card(e)).join('')}</div>`:blank('小さな「やってみたい」から。','一緒に食べたいごはんも、遠くへの旅も。','<button class="primary" data-new-dream>最初の夢を追加する ＋</button>')}`}
function groups(){if(groupId){const g=state.groups.find(x=>x.id===groupId);if(!g){groupId=null;return groups()}const ds=state.entries.filter(e=>(e.groupIds||[]).includes(g.id)&&(filter==='all'||e.type===filter));return `<button class="subtle" id="backGroups">${icon('back')} グループ一覧</button><section class="group-top"><div class="eyebrow">OUR LITTLE SPACE</div><div class="row"><h2>${esc(g.name)}</h2>${icon('family')}</div><p>${esc(g.note||'大切な人と、叶えていきたいこと。')}</p><div class="row wrap" style="margin-top:18px"><span class="pill">${esc(state.profile.name||'あなた')} · この端末で作成</span><button class="button" id="invite">招待について</button></div></section><div class="notice">共有画面の準備中です。相手の端末にはまだ届きません。個人メモはこの画面に表示しません。</div><div class="row"><h3>このグループに残すこと</h3><button class="subtle" id="editGroup">グループ設定</button></div>${filterBar(true)}${ds.length?`<div class="cards">${ds.map(e=>card(e,true)).join('')}</div>`:blank('ふたりの「やりたい」を、ここに。','共有したい夢や思い出だけ、選んで残せます。','<button class="primary" id="groupDream">一緒の夢を追加 ＋</button>')}`}
return `<div class="intro"><div class="eyebrow">A SPACE FOR YOUR PEOPLE</div><h2>家族の余白。</h2><p class="lead">自分のすべてではなく、分かちあいたいことを。</p></div><div class="notice">この版は端末内でグループと共有先を整理できます。実際の招待・共有は未接続です。</div>${state.groups.map(g=>{const ds=state.entries.filter(e=>(e.groupIds||[]).includes(g.id));return `<button class="groupcard" data-group="${esc(g.id)}"><div class="row"><div class="row" style="justify-content:flex-start"><span class="group-badge">${icon('family')}</span><div><h3>${esc(g.name)}</h3><p>${ds.filter(e=>e.type==='dream').length} の夢 · ${ds.filter(e=>e.type==='memory').length} の思い出</p></div></div>${icon('chevron')}</div></button>`}).join('')}${!state.groups.length?blank('大切な人との、小さな場所。','夫婦用、家族用。共有したい相手ごとに整理できます。'):''}<button class="button" id="newGroup" style="width:100%;margin-top:12px">${icon('plus')} グループをつくる</button><section class="setting-card" style="margin-top:25px"><div class="row"><h3>${icon('lock')} 自分の記録は、自分のもの。</h3></div><p class="help">グループを作っても、人生年表のすべてを共有することはありません。夢や思い出ごとに、共有先を選びます。</p></section>`}
function settings(){const p=state.profile;return `<div class="intro"><div class="eyebrow">MY PAGE</div><h2>自分のペースを、大切に。</h2><p class="lead">年表の設定も、大切な記録の持ち出しも。</p></div><div class="settings"><form class="setting-card" id="profileForm"><h3>わたしの時間</h3><label for="p-name">ニックネーム</label><input id="p-name" name="name" maxlength="30" value="${esc(p.name)}" placeholder="あなたの呼び名"><label for="p-birth">生年月日 · 自分だけ</label><input id="p-birth" name="birth" type="date" max="${today()}" value="${esc(p.birth)}"><div class="row"><div class="field"><label for="p-age">目標年齢</label><input id="p-age" name="age" type="number" min="1" max="120" required value="${esc(p.age)}"></div><div class="field"><label for="p-display">残り時間の単位</label><select name="display" id="p-display">${[['days','日'],['weeks','週'],['years','年']].map(([v,t])=>`<option value="${v}" ${p.display===v?'selected':''}>${t}</option>`).join('')}</select></div></div><label class="check-row"><input name="showLife" type="checkbox" ${p.showLife?'checked':''}> 目標年齢までの残り時間を表示する</label><div class="actions"><button class="primary" type="submit">設定を保存</button></div></form><section class="setting-card"><div class="row"><h3>年表に重ねる、家族の年齢</h3><button class="subtle" id="newFamily">＋ 追加</button></div><p class="help">家族との予定を考えるための、自分だけの情報です。</p>${(p.family||[]).map(f=>`<div class="row" style="margin-top:14px;font-size:12px"><span>${esc(f.name)} <small> · ${esc(f.birth)}</small></span><button class="subtle" data-family-edit="${esc(f.id)}">編集</button></div>`).join('')}</section><section class="setting-card"><h3>写真も、思い出も、手元に。</h3><p class="help">設定・夢・思い出・添付写真をまとめて書き出せます。機種変更やブラウザのデータ消去に備えて残しておきましょう。</p><div class="actions"><button class="button" id="export">書き出す ↓</button><button class="button" id="import">読み込む ↑</button></div><input type="file" id="importFile" accept="application/json,.json" hidden></section><section class="setting-card"><h3>画面の使い心地を試す</h3><p class="help">架空の思い出と夢を使って、写真付きの年表やグループ画面を確認できます。自分の記録とは分けて表示します。</p><div class="action
